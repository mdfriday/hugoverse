# .github/workflows/release.yaml

name: Release

on:
  push:
    tags:
      - '**'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Generate Release Notes
        id: generate_release_notes
        run: |
          release_notes=$(git log $(git describe --tags --abbrev=0)..HEAD --oneline)
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$release_notes" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.HUGOVERSE_RELEASE }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
          body: ${{ env.RELEASE_NOTES }}

  releases-matrix:
    needs: release
    name: Release Go Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
        exclude:
          - goarch: arm64
            goos: windows
    steps:
      - uses: actions/checkout@v3
      - uses: wangyoucao577/go-release-action@v1
        with:
          github_token: ${{ secrets.HUGOVERSE_RELEASE }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          extra_files: LICENSE README.md manifest.json
          pre_command: >
            if command -v apt-get > /dev/null; then
              export DEBIAN_FRONTEND=noninteractive && \
              apt-get update && \
              apt-get install --no-install-recommends -y curl wget git build-essential zip xz-utils jq ca-certificates libvips-dev libvips-tools gcc musl-dev pkg-config
            elif command -v apk > /dev/null; then
              apk add --no-cache curl wget git build-base zip xz jq ca-certificates vips-dev gcc musl-dev pkgconfig
            elif command -v yum > /dev/null; then
              yum install -y curl wget git gcc gcc-c++ make zip xz jq ca-certificates libvips-devel
            else
              echo "Unsupported package manager" >&2
              exit 1
            fi
            echo "PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/local/lib/pkgconfig:/usr/share/pkgconfig" >> /etc/environment && \
            echo "PATH=$PATH:/usr/bin:/usr/local/bin" >> /etc/environment && \
            which pkg-config && \
            pkg-config --version
